name: Sync Authorized Artist Artwork

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine whether the artwork archive needs a refresh
        id: archive
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Eq '^(data/artists\.json|scripts/sync-artworks\.mjs|scripts/validate-artworks\.mjs|\.github/workflows/sync-artworks\.yml)$'; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover and archive the latest authorized works
        if: steps.archive.outputs.sync == 'true'
        run: node scripts/sync-artworks.mjs

      - name: Validate catalogue and archived image files
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-artworks.mjs

      - name: Commit artwork files and provenance manifest
        if: steps.archive.outputs.sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json docs/assets/artists/
          if git diff --cached --quiet; then
            echo "Artwork archive is already up to date."
          else
            git commit -m "Archive latest authorized artist artworks"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp -R docs/. _site/
          cp data/artists.json _site/data/artists.json
          cp data/artworks.json _site/data/artworks.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy updated Artist Atlas
        id: deployment
        uses: actions/deploy-pages@v4

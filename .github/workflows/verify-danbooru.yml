name: Verify Danbooru artist candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/candidates.json"
      - "scripts/verify-danbooru.mjs"

permissions:
  contents: write

concurrency:
  group: danbooru-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify candidates and collect General previews
        run: node scripts/verify-danbooru.mjs
      - name: Commit verification results
        run: |
          if git diff --quiet -- data/verified-artists.json; then
            echo "No verification data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-artists.json
          git commit -m "Update Danbooru artist verification results"
          git push
